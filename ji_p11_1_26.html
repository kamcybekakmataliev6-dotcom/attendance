<!doctype html>
<html lang="ky">
  <head>
    <meta charset="UTF-8" />
    <title>Ж.И - ПОВТАС9-1-25</title>
    <style>
      body {
        font-family: Arial;
        text-align: center;
        padding: 40px;
        background: #f0f2f5;
        margin: 0;
      }
      .container {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        display: inline-block;
      }
      h1 {
        color: #2c3e50;
        font-size: 22px;
        margin: 10px 0;
      }
      h2 {
        color: #3498db;
        font-size: 20px;
        margin: 5px 0 20px 0;
      }
      #qrcode {
        margin: 25px auto;
        padding: 20px;
        background: #fff;
        border: 3px solid #3498db;
        border-radius: 12px;
        display: inline-block;
      }
      .timer {
        font-size: 28px;
        color: #e74c3c;
        font-weight: bold;
        margin-top: 15px;
      }
      .info {
        color: #888;
        font-size: 13px;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📚 Ж.И</h1>
      <h2>Группа: ПОВТАС11-1-26</h2>
      <p>Телефонуңуз менен QR кодду сканерлеңиз:</p>
      <div id="qrcode"></div>
      <div class="timer" id="timerDisplay">30с</div>
      <div class="info">⚠️ QR код ар 30 секундда жаңыланат</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
      const SUBJECT = "Ж.И";
      const GROUP = "ПОВТАС11-1-26";
      const APPS_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbzfHSeJgYB9e49NHrzC-sZIwN2n6MM6mBpWMxuLfca2YLkKV7FwhkUxFzEQEwUlFYai/exec";
      const SECRET = "menin_kuput_sozum_2025";
      const REFRESH_SECONDS = 30;
      const STUDENT_URL =
        "https://kamcybekakmataliev6-dotcom.github.io/attendance/student.html";

      let countdown = REFRESH_SECONDS;

      function createToken() {
        const timestamp = Math.floor(Date.now() / 1000);
        const raw = SECRET + "_" + timestamp;
        let hash = 0;
        for (let i = 0; i < raw.length; i++) {
          const char = raw.charCodeAt(i);
          hash = (hash << 5) - hash + char;
          hash = hash & hash;
        }
        return Math.abs(hash).toString(36) + "_" + timestamp;
      }

      function generateQR() {
        const token = createToken();
        const formURL = `${STUDENT_URL}?token=${encodeURIComponent(token)}&subject=${encodeURIComponent(SUBJECT)}&group=${encodeURIComponent(GROUP)}`;
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = "";
        new QRCode(qrContainer, {
          text: formURL,
          width: 260,
          height: 260,
          correctLevel: QRCode.CorrectLevel.H,
        });
      }

      function startTimer() {
        countdown = REFRESH_SECONDS;
        document.getElementById("timerDisplay").innerText = countdown + "с";
        setInterval(() => {
          countdown--;
          if (countdown < 0) countdown = REFRESH_SECONDS;
          document.getElementById("timerDisplay").innerText = countdown + "с";
        }, 1000);
      }

      setInterval(generateQR, REFRESH_SECONDS * 1000);
      window.onload = function () {
        generateQR();
        startTimer();
      };
    </script>
  </body>
</html>
